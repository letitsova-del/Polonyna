  /* Explosion graphic */
  #burst { position: absolute; left: var(--dx); top: var(--dy); width: 1920px; height: 1080px; mix-blend-mode: difference; transform-origin: 1528px 665px;
           will-change: transform; visibility: hidden; }
  #burst svg { position: absolute; left: 0; top: 0; overflow: visible; }
  /* Group 2 shards: separate layers above the main graphic */
  #shards { position: absolute; inset: 0; pointer-events: none; }
  .shard { position: absolute; left: var(--dx); top: var(--dy); width: 1920px; height: 1080px; mix-blend-mode: difference; transform-origin: 1528px 665px; will-change: transform; visibility: hidden; }
  .shard svg { position: absolute; overflow: visible; transform-origin: 50% 50%; }

  /* Circles + particles */
  #dots { position: absolute; inset: 0; mix-blend-mode: difference; pointer-events: none; }
  .dot { position: absolute; left: 0; top: 0; border-radius: 50%; background: #fff; will-change: transform; }

  /* Typography — positions taken 1:1 from the Figma frame */
  .ar { translate: var(--dx) 0; }      /* anchored to the right edge */
  .ab { translate: 0 var(--dyb); }     /* anchored to the bottom edge */
  .t { position: absolute; text-transform: uppercase; white-space: nowrap; mix-blend-mode: difference; color: #fff; }
  .medium { font-weight: 500; font-size: 20px; line-height: 1.43; letter-spacing: -0.2px; }
  .title { font-weight: 800; font-size: 125px; line-height: .9; letter-spacing: -7.5px; }
  .line { display: block; overflow: hidden; padding: .06em .1em .02em; margin: -.06em -.1em -.02em; }
  .w { display: inline-block; transform: translate3d(0,115%,0); transition: transform 1s var(--ease-out) var(--d, 0s); }
  .ch { display: inline-block; vertical-align: top; }
  a.btn .ch { clip-path: inset(.33em -1em .33em -1em); }
  #tickets .ch { clip-path: inset(.06em -1em .06em -1em); }
  .in .w { transform: none; }

  /* roll-over buttons */
  a.btn { color: inherit; text-decoration: none; display: inline-block; position: relative; }
  .r { display: block; position: relative; transition: transform .55s var(--ease-io) calc(var(--i) * 16ms); }
  .r > span { display: block; }
  .r > span + span { position: absolute; left: 0; top: 100%; }
  a.btn:hover .r, a.btn:focus-visible .r { transform: translate3d(0,-100%,0); }
  a.btn:focus-visible { outline: none; }

  .nav a.btn { padding-left: 0; transition: padding-left .45s var(--ease-out); }
  .nav a.btn::before { content: ""; position: absolute; left: 0; top: 50%; width: 9px; height: 9px; margin-top: -5px;
                       border-radius: 50%; background: #fff; transform: scale(0); transition: transform .45s var(--ease-out); }
  .nav a.btn:hover, .nav a.btn:focus-visible { padding-left: 18px; }
  .nav a.btn:hover::before, .nav a.btn:focus-visible::before { transform: scale(1); }

  #tickets { font-weight: 800; font-size: 94.161px; line-height: .9; letter-spacing: -5.6497px; }
  #tickets .ul { position: absolute; left: 0; right: 0; bottom: -14px; height: 6px; overflow: hidden; }
  #tickets .ul::before, #tickets .ul::after { content: ""; position: absolute; inset: 0; background: #fff; }
  #tickets .ul::before { transform: scaleX(0); transform-origin: 0 50%; transition: transform 1s var(--ease-out) var(--d, 0s); }
  .in #tickets .ul::before { transform: scaleX(1); }
  #tickets .ul::after { transform: translateX(-101%); transition: transform .0s; }
  .settled #tickets .ul::before { transition: none; }
  #tickets:hover .ul::before { transform: translateX(101%); transition: transform .5s var(--ease-io); }
  #tickets:hover .ul::after { transform: none; transition: transform .5s var(--ease-io) .18s; }

  .tag { font-weight: 800; font-size: 37px; line-height: 1; letter-spacing: -2.22px; }
  .slogan { font-weight: 800; font-size: 47px; line-height: 1; letter-spacing: -2.82px; text-align: right; }

  #flash { position: absolute; inset: 0; background: #fff; mix-blend-mode: difference; opacity: 0; pointer-events: none; }

  #cursor { position: fixed; left: 0; top: 0; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%;
            background: #fff; mix-blend-mode: difference; pointer-events: none; z-index: 10; opacity: 0;
            transition: width .35s var(--ease-out), height .35s var(--ease-out), margin .35s var(--ease-out), opacity .3s; }
  #cursor.big { width: 64px; height: 64px; margin: -32px 0 0 -32px; }
  body.has-cursor #cursor { opacity: 1; }

  #hint { border: 0; background: none; cursor: pointer; padding: 6px; position: fixed; right: calc(14px + env(safe-area-inset-right, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); font: 500 11px/1 'Inter', sans-serif; letter-spacing: .02em;
          color: #fff; opacity: .5; mix-blend-mode: difference; text-transform: uppercase; z-index: 11; }
  #hint:hover { opacity: 1; }

  /* ===================== extra screens (About = hero) ===================== */
  .scr { position: absolute; inset: 0; visibility: hidden; background: var(--bg); isolation: isolate; overflow: hidden; }

<script>
(() => {
  let W = 1920, H = 1080; const P = { x: 1528, y: 665 }; const OFF = { dx: 0, dy: 0 };
  const stage = document.getElementById('stage');
  const shake = document.getElementById('shake');
  const burst = document.getElementById('burst');
  const dotsEl = document.getElementById('dots');
  const flash = document.getElementById('flash');
  const cursor = document.getElementById('cursor');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- fit stage ---------- */
  let S = 1;
  function fit() {
    // scale by whichever side is tighter, then grow the stage to cover the rest of the viewport
    S = Math.min(innerWidth / 1920, innerHeight / 1080);
    W = innerWidth / S; H = innerHeight / S;
    OFF.dx = W - 1920;                 // explosion & right-hand elements stick to the right edge
    OFF.dy = (H - 1080) / 2;           // explosion stays vertically centred
    const dyb = H - 1080;              // hero title & slogan stick to the bottom
    P.x = 1528 + OFF.dx; P.y = 665 + OFF.dy;
    stage.style.width = W + 'px'; stage.style.height = H + 'px';
    stage.style.setProperty('--dx', OFF.dx + 'px');
    stage.style.setProperty('--dy', OFF.dy + 'px');
    stage.style.setProperty('--dyb', dyb + 'px');
    stage.style.transform = `scale(${S})`;
  }
  addEventListener('resize', fit); fit();

  /* ---------- split text into animated chars ---------- */
  document.querySelectorAll('[data-split]').forEach(el => {
    const isBtn = (el.classList.contains('btn') || el.closest('a.btn')) && !el.closest('.nav');   // nav: no letter roll
    const txt = el.textContent; el.textContent = '';
    el.setAttribute('aria-label', txt);
    [...txt].forEach((c, i) => {
      const ch = document.createElement('span'); ch.className = 'ch'; ch.setAttribute('aria-hidden', 'true');
      const w = document.createElement('span'); w.className = 'w';
      const glyph = c === ' ' ? ' ' : c;
      if (isBtn) {
        const r = document.createElement('span'); r.className = 'r'; r.style.setProperty('--i', i);
        r.innerHTML = `<span>${glyph}</span><span>${glyph}</span>`;
        w.appendChild(r);
      } else w.textContent = glyph;
      ch.appendChild(w); el.appendChild(ch);
    });
  });

  // intro delays (seconds after the explosion) per group
  function setDelays() {
    const q = s => [...document.querySelectorAll(s)];
    const titles = q('.title .line');
    titles.forEach((ln, li) => ln.querySelectorAll('.w').forEach((w, i) => w.style.setProperty('--d', (0.25 + li * 0.12 + i * 0.028) + 's')));
    q('.medium .line').forEach((ln, li) => ln.querySelectorAll('.w').forEach((w, i) => w.style.setProperty('--d', (0.55 + li * 0.07 + i * 0.012) + 's')));
    q('.tag .line, .slogan .line').forEach((ln, li) => ln.querySelectorAll('.w').forEach((w, i) => w.style.setProperty('--d', (0.7 + li * 0.08 + i * 0.014) + 's')));
    q('#tickets .w').forEach((w, i) => w.style.setProperty('--d', (0.6 + i * 0.035) + 's'));
    document.querySelector('#tickets .ul').style.setProperty('--d', '1.05s');
  }
  setDelays();

  /* ---------- helpers ---------- */
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const rand = (a, b) => a + Math.random() * (b - a);
  const easeOutExpo = t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t);
  const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const easeOutBack = t => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };

  /* ---------- circles ---------- */
  // the four circles from the Figma composition + extra ones
  const designDots = [ [542, 331, 49], [960, 496, 36], [936, 644, 15], [723, 696, 14] ];
  const extra = [ [430, 520, 9], [1090, 380, 7] ];   // two small circles that appear only after the blast
  // preloader spiral per circle: [start radius, start angle°, clockwise turns, appear delay s]
  const SPIRAL = [ [950, 195, 1.75, 0], [740, 160, 1.85, .18], [560, 215, 1.65, .34], [420, 140, 1.9, .48] ];
  let dots = [];
  function makeDots() {
    dotsEl.innerHTML = '';
    dots = designDots.concat(extra).map(([hx, hy, r], i) => {
      const el = document.createElement('div'); el.className = 'dot';
      el.style.width = el.style.height = r * 2 + 'px';
      el.style.marginLeft = el.style.marginTop = -r + 'px';
      dotsEl.appendChild(el);
      return {
        el, r, hx, hy,
        // preloader spiral params
        post: !SPIRAL[i], born: (SPIRAL[i] || [0, 0, 0, 0])[3], th0: (SPIRAL[i] || [0, 0])[1] * Math.PI / 180, R0: (SPIRAL[i] || [0])[0], spins: (SPIRAL[i] || [0, 0, 0])[2],
        // idle wander
        x: P.x, y: P.y, vx: 0, vy: 0, a: rand(0, Math.PI * 2), sp: lerp(70, 22, clamp((r - 4) / 45)),
        flyDelay: rand(0, .25), px: P.x, py: P.y
      };
    });
  }

  const particles = [];
  function spawnParticles(x, y, n, power = 1) {
    for (let i = 0; i < n; i++) {
      const el = document.createElement('div'); el.className = 'dot';
      const r = rand(1.5, 5) * (Math.random() < .12 ? 2.2 : 1);
      el.style.width = el.style.height = r * 2 + 'px'; el.style.marginLeft = el.style.marginTop = -r + 'px';
      dotsEl.appendChild(el);
      const a = rand(0, Math.PI * 2), v = rand(400, 1700) * power;
      particles.push({ el, x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0, max: rand(.6, 1.4) });
    }
  }

  // circles are only ever scaled uniformly — never stretched
  function placeDot(d, x, y, s = 1) {
    d.el.style.transform = `translate3d(${x}px,${y}px,0) scale(${s})`;

0 63.5 93.1 57.7 93.5 C 46.0 94.4 9.1 103.3 0.6 99.6 Z"}, {"x": 1398, "y": 0, "w": 33, "h": 50, "d": "M0 49.5L5.5 -19.5L33 -21L27 39.5L0 49.5Z"}, {"x": 1700.97, "y": 356, "w": 70, "h": 36, "d": "M69.4946 35.0684L0.687227 27.5323L0.000338616 1.66893e-06L60.2967 7.78479L69.4946 35.0684Z"}];
  const shardsEl = document.getElementById('shards');
  const prng = (i, k) => { const v = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return v - Math.floor(v); };
  const shards = SHARDS.map((s, i) => {
    const wrap = document.createElement('div'); wrap.className = 'shard';
    wrap.innerHTML = `<svg width="${s.w}" height="${s.h}" viewBox="0 0 ${s.w} ${s.h}" style="left:${s.x}px;top:${s.y}px" aria-hidden="true"><path d="${s.d}" fill="white"/></svg>`;
    shardsEl.appendChild(wrap);
    return {
      wrap, svg: wrap.firstChild,
      depth: .35 + prng(i, 1) * .65,          // 0.35 (far) … 1 (close)
      lag: .04 + prng(i, 2) * .16,            // beat phase delay
      amp: 1.5 + prng(i, 3) * 1.4,            // pulse strength vs. main graphic
      delay: .02 + prng(i, 4) * .12,          // intro delay
      fw: .25 + prng(i, 5) * .35, fp: prng(i, 6) * 6.28,   // float speed / phase

  const TPRE = 3.2;         // circles appear + spiral in
  const TB = T0 + TPRE;     // moment of collision
  let clock = 0, last = 0, booted = false, introDone = false;
  let mouse = { x: -9999, y: -9999, nx: .5, ny: .5, sx: .5, sy: .5 };
  let beatT = 0.78, beatAmp = 0.028, kick = 0, kickV = 0, beatPhase = 0, rotSpeedBoost = 0;
  const BASE = 1;
  let spin = 0;              // accumulated idle rotation, deg

  function reset() {
    document.body.classList.remove('in', 'ready', 'settled');
    burst.style.visibility = 'hidden';
    shards.forEach(s => { s.wrap.style.visibility = 'hidden'; s.wrap.style.transform = 'scale(0)'; });
    burst.style.clipPath = 'none';
    flash.style.opacity = 0;
    particles.splice(0).forEach(p => p.el.remove());
    makeDots(); introDone = false; booted = false; spin = 0;
    clock = 0; last = performance.now();
    requestAnimationFrame(() => document.body.classList.add('ready'));
  }

  function boom() {
    booted = true;
    burst.style.visibility = 'visible';
    shards.forEach(s => s.wrap.style.visibility = 'visible');
    document.body.classList.add('in');
    setTimeout(() => document.body.classList.add('settled'), 2600);
    dots.forEach(d => { d.x = P.x; d.y = P.y; });
    // after the blast only the smallest original circle remains (+ 2 new small ones)
    dots.filter(d => !d.post).sort((a, b) => b.r - a.r).slice(0, 3).forEach(d => { d.gone = true; d.el.style.display = 'none'; });
  }

  function frame(now) {
    const dt = Math.min(1 / 30, Math.max(0, (now - last) / 1000)); last = now;
    if (!document.hidden) clock += dt;
    const t = clock;
    mouse.sx = lerp(mouse.sx, mouse.nx, .06); mouse.sy = lerp(mouse.sy, mouse.ny, .06);

    if (!booted && t >= TB) boom();

    if (!booted) {
      /* ---- PRELOADER: 4 circles appear, then spiral clockwise (eased, accelerating) into P ---- */
      dots.forEach(d => {
        const lt = t - T0 - d.born;
        if (d.post || lt < 0) { d.el.style.transform = 'scale(0)'; return; }
        const u = clamp(lt / (TPRE - d.born));
        const ea = Math.pow(u, 2.2);                      // angular speed builds up
        const er = 1 - Math.pow(1 - u, 1.15);             // radius closes in steadily
        const th = d.th0 + d.spins * Math.PI * 2 * ea;
        const R = d.R0 * (1 - er);
        const x = P.x + Math.cos(th) * R;
        const y = P.y + Math.sin(th) * R * .8;
        const vx = (x - d.px) / Math.max(dt, .001), vy = (y - d.py) / Math.max(dt, .001);
        d.px = x; d.py = y;
        const s = easeOutBack(clamp(lt / .6)) * (u > .94 ? lerp(1, .3, (u - .94) / .06) : 1);
        placeDot(d, x, y, Math.max(0, s));
      });
    } else {
      const tb = t - TB;

      /* ---- EXPLOSION graphic ---- */
      // scale: 0 → 1.2 (bigger than original) → 0.95 → 1, then regular beat

      const introFn = (k, peak) => {
        if (k <= 0) return 0;
        if (k < .5) return peak * easeOutCubic(k / .5);
        if (k < .95) return lerp(peak, .95, easeInOut((k - .5) / .45));
        if (k < 1.35) return lerp(.95, 1, easeOutCubic((k - .95) / .4));

      };

      const ph = beatPhase % 1;

        const intro = introFn(k, 1.2 + .3 * s.depth);
        const sp = ((beatPhase - s.lag) % 1 + 1) % 1;
        const sPulse = beatAmp * s.amp * Math.min(1, sp / .07) * Math.pow(1 - sp, 3) * idleW;
        const fx = Math.sin(tb * s.fw + s.fp) * 14 * s.depth * idleW;
        const fy = Math.cos(tb * s.fw * 1.3 + s.fp) * 10 * s.depth * idleW;
        const px = 0, py = 0;
        const sRot = rot * (1 + (s.depth - .6) * .06) + Math.sin(tb * s.fw * .8 + s.fp) * 2.2 * idleW;
        const sSc = intro * (1 + sPulse + kick * (1 + s.depth * .6));
        s.wrap.style.transform = `translate3d(${px + fx}px,${py + fy}px,0) rotate(${sRot}deg) scale(${Math.max(0, sSc)})`;
        s.svg.style.transform = `rotate(${Math.sin(tb * s.ww + s.wp) * 7 * idleW}deg)`;
      });

      /* ---- flash + camera shake ---- */
      flash.style.opacity = !reduce && tb < .45 ? (1 - tb / .45) * .95 : 0;
      const sh = !reduce && tb < .7 ? 16 * Math.pow(1 - tb / .7, 2) : 0;
      const kickSh = Math.abs(kick) * 50;
      shake.style.transform = (sh + kickSh) > .1 ? `translate3d(${rand(-1,1) * (sh + kickSh)}px,${rand(-1,1) * (sh + kickSh)}px,0)` : '';

      /* ---- circles: fly out of P, then roam freely ---- */
      dots.forEach((d, i) => {
        if (d.gone) return;
        const ft = tb - .05 - d.flyDelay, FLY = 1.5;
        if (ft < FLY) {
          const k = easeOutExpo(clamp(ft / FLY));
          const nx = lerp(P.x, d.hx + OFF.dx * .5, k), ny = lerp(P.y, d.hy + OFF.dy, k);
          d.vx = (nx - d.x) / Math.max(dt, .001) * .15; d.vy = (ny - d.y) / Math.max(dt, .001) * .15;
          d.x = nx; d.y = ny;
          placeDot(d, d.x, d.y, easeOutBack(clamp(ft / .6)));
          return;
        }
        // wander: heading drifts smoothly, steering + soft bounds + cursor repulsion
        d.a += (Math.sin(t * .37 + i * 1.7) * .6 + Math.sin(t * .91 + i) * .4) * dt * 1.1;
        let ax = Math.cos(d.a) * d.sp - d.vx, ay = Math.sin(d.a) * d.sp - d.vy;
        const m = 140;
        if (d.x < m) ax += (m - d.x) * 1.2; if (d.x > W - m) ax -= (d.x - (W - m)) * 1.2;
        if (d.y < m) ay += (m - d.y) * 1.2; if (d.y > H - m) ay -= (d.y - (H - m)) * 1.2;
        const dx = d.x - mouse.x, dy = d.y - mouse.y, dist = Math.hypot(dx, dy), rad = 170 + d.r;
        if (dist < rad && dist > .1) { const f = (1 - dist / rad) * 2600; ax += dx / dist * f; ay += dy / dist * f; }
        d.vx += ax * dt * .9; d.vy += ay * dt * .9;
        d.x += d.vx * dt; d.y += d.vy * dt;

      });
    }

    /* ---- particles ---- */
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i]; p.life += dt;
      const k = p.life / p.max;
      if (k >= 1) { p.el.remove(); particles.splice(i, 1); continue; }
      p.vx *= Math.pow(.06, dt); p.vy *= Math.pow(.06, dt);
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.el.style.transform = `translate3d(${p.x}px,${p.y}px,0) scale(${1 - k})`;

  }

  /* ---------- reduced motion: show final composition ---------- */
  function showStatic() {
    document.body.classList.add('ready', 'in');

  /* ---------- interaction ---------- */

  stage.addEventListener('pointerleave', () => { mouse.x = mouse.y = -9999; });

  if (matchMedia('(hover: hover) and (pointer: fine)').matches) {
    document.body.classList.add('has-cursor');
    addEventListener('pointermove', e => { cursor.style.transform = `translate3d(${e.clientX}px,${e.clientY}px,0)`; });
    document.querySelectorAll('a.btn').forEach(a => {
      a.addEventListener('pointerenter', () => cursor.classList.add('big'));
      a.addEventListener('pointerleave', () => cursor.classList.remove('big'));
    });
  }

  // nav: small kick on hover; prevent jump for demo anchors
  document.querySelectorAll('.nav a.btn').forEach(a => {
    a.addEventListener('click', e => e.preventDefault());
  });

  // tickets: faster heartbeat on hover, explosion kick + burst on click, magnetic pull
  const tk = document.getElementById('tickets');
  tk.addEventListener('pointerenter', () => { document.body.classList.add('hot'); });
  tk.addEventListener('pointerleave', () => { document.body.classList.remove('hot'); tk.style.transform = ''; });
  tk.addEventListener('pointermove', e => {
    const r = tk.getBoundingClientRect();
    const mx = (e.clientX - (r.left + r.width / 2)) / S, my = (e.clientY - (r.top + r.height / 2)) / S;
    tk.style.transition = 'transform .25s cubic-bezier(.16,1,.3,1)';
    tk.style.transform = `translate(${mx * .18}px, ${my * .3}px)`;
  });
  tk.addEventListener('click', e => {
    e.preventDefault();
    if (!booted) return;
    kickV += 1.6;
    dots.forEach(d => { const dx = d.x - P.x, dy = d.y - P.y, l = Math.hypot(dx, dy) || 1; d.vx += dx / l * 520; d.vy += dy / l * 520; });
  });

  document.getElementById('hint').addEventListener('click', () => reset());
  addEventListener('keydown', e => { if (e.key === 'r' || e.key === 'R' || e.key === 'к' || e.key === 'К') { reset(); } });

  /* ---------- go ---------- */
  const go = () => {
    const run = () => { reset(); requestAnimationFrame(frame); };
    if (document.hidden) document.addEventListener('visibilitychange', function v() { if (!document.hidden) { document.removeEventListener('visibilitychange', v); run(); } });
    else run();
  };
  Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]).then(go);
})();

    return [lerp(A[0], B[0], e) + Math.cos(th) * rr, lerp(A[1], B[1], e) + Math.sin(th) * rr]; }
  // the explosion of the current screen spins up, shrinks and drifts along a spiral to where the next one will unwind
  async function spinOut(a, b, fast) {
    const A = focal(a), B = focal(b), th0 = Math.atan2(A[1] - B[1], A[0] - B[0]);
    const charged = pm.to === b, e0 = charged ? PM_E * pm.pr : 0, r0 = pm.rot, sc0 = 1, v0 = 0; pmReset();
    if (a.hero) document.body.classList.add('out'); else a.el.classList.add('leaving');
    const has = a.hero || a.bst; let ang = 0;
    let lt = performance.now();
    await tween(fast ? 700 : (charged ? 720 : 900), t => { const n = performance.now(), d = Math.min(.05, (n - lt) / 1000); lt = n;
      const v = Math.max(v0, 120) + (fast ? 2800 : 2300) * Math.pow(t, 1.8); ang += v * d;
      const sc = sc0 * (1 - E.inCubic(t) * .97), p = spiral(A, B, e0 + (1 - e0) * (charged ? E.inCubic(t) * .4 + t * .6 : E.inOut(t)), th0), ox = p[0] - A[0], oy = p[1] - A[1];
      if (a.hero) { bwrap.style.transform = `translate(${ox}px,${oy}px) rotate(${r0 + ang}deg) scale(${sc})`; heroDots.style.opacity = 1 - t; }
      else if (a.bst) { a.xr = r0 + ang; a.xs = sc; a.ox = ox; a.oy = oy; }
      else { a.el.style.opacity = 1 - E.inCubic(t); }
      if (a.rings) a.el.querySelector('canvas.full').style.opacity = 1 - E.inCubic(t);
      a.el.querySelectorAll('.mdot').forEach(d => d.style.opacity = 1 - t); });
    return { A, B, th0, has };
  }
  function resetOut(a) {
    if (a.hero) { bwrap.style.transform = ''; heroDots.style.opacity = ''; document.body.classList.remove('out'); }
    else { a.xr = 0; a.xs = 1; a.ox = 0; a.oy = 0; a.el.style.opacity = ''; const c = a.el.querySelector('canvas.full'); if (c) c.style.opacity = ''; a.el.querySelectorAll('.mdot').forEach(d => d.style.opacity = ''); }
  }
  async function spinIn(b, path, fast) {
    if (b.hero) { await tween(1500, t => { const e = E.outExpo(t); let ox = 0, oy = 0; if (!path.has) { const p = spiral(path.A, path.B, E.outCubic(t), path.th0); ox = p[0] - path.B[0]; oy = p[1] - path.B[1]; } bwrap.style.transform = `translate(${ox}px,${oy}px) rotate(${-600 * (1 - e)}deg) scale(${introFn(t * 1.6)})`; }); bwrap.style.transform = ''; }
    else { b.introSpin = fast ? 900 : 600; b.spin = 0; if (!path.has) b.trav = { A: path.A, B: path.B, th0: path.th0, t0: clock, d: 1.3 }; setTimeout(() => b.introSpin = 28, 2600); }
  }

  /* About ↔ Plan: it is the same explosion — it flies over, turning and resizing, and lands exactly where the next screen has it */
  const flyer = document.createElement('div'); flyer.id = 'flyer'; flyer.innerHTML = U; stage.insertBefore(flyer, fx);
  const heroBurst = document.getElementById('burst');
  const parseT = el => { const m = (el && el.style.transform) || ''; const r = /rotate\(([-\d.e]+)deg\)/.exec(m), k = /scale\(([-\d.e]+)\)/.exec(m); return [r ? +r[1] : 0, k ? +k[1] : 1]; };
  async function morph(a, b) {
    const hero = a.hero ? a : b, plan = a.hero ? b : a, toPlan = a.hero;
    const A = focal(a);
    const [r0, s0] = toPlan ? parseT(heroBurst) : parseT(plan.bst);
    const tgt = () => toPlan ? [plan.b.r + plan.spin, plan.b.s] : parseT(heroBurst);
    const [rt0] = tgt(); const turn = (((rt0 - r0) % 360) + 360) % 360 + 360;   // land on the same angle after ~1–2 extra turns
    pmReset(); flyer.style.display = 'block';
    if (toPlan) { bwrap.style.opacity = 0; document.body.classList.add('out'); heroDots.style.transition = 'opacity .4s'; heroDots.style.opacity = 0; }
    else { plan.bst.style.opacity = 0; plan.el.classList.add('leaving'); plan.el.querySelectorAll('.mdot').forEach(d => d.style.opacity = 0); }
    let switched = false;
    const doSwitch = () => { switched = true; hide(a); resetOut(a); prime(b); show(b); reveal(b);
      if (toPlan) { plan.introSpin = 0; plan.spin = 0; plan.bst.style.opacity = 0; plan.enter = clock - 3; plan.el.querySelectorAll('.mdot').forEach(d => d.style.opacity = 0); }
      else { bwrap.style.opacity = 0; } };
    await tween(1350, t => { if (!switched && t > .32) doSwitch();
      const e = E.inOut(t), B = focal(b), dx = B[0] - A[0], dy = B[1] - A[1], L = Math.hypot(dx, dy) || 1, bulge = Math.sin(Math.PI * e) * Math.min(320, L * .35);
      const x = lerp(A[0], B[0], e) - dy / L * bulge, y = lerp(A[1], B[1], e) + dx / L * bulge;
      const [rt, st] = tgt(), rot = r0 + (turn + (rt - rt0)) * e, sc = lerp(s0, st, e) * (1 - .28 * Math.sin(Math.PI * e));
      flyer.style.transform = `translate(${x - 1528}px,${y - 665}px) rotate(${rot}deg) scale(${sc})`; });
    if (!switched) doSwitch();
    if (toPlan) { plan.bst.style.opacity = ''; plan.el.querySelectorAll('.mdot').forEach(d => d.style.opacity = ''); } else { bwrap.style.opacity = ''; }
    heroDots.style.opacity = ''; heroDots.style.transition = ''; plan.bst.style.opacity = ''; flyer.style.display = 'none';
  }

  const V = {
    morph,
    spin: async (a, b) => { const fast = b.id === 'tickets'; const path = await spinOut(a, b, fast); hide(a); resetOut(a); prime(b); show(b); reveal(b); const p = spinIn(b, path, fast); if (b.hero) await p; },
    blast: async (a, b) => { const [x0, y0] = focal(a), [x1, y1] = focal(b);
      await tween(560, t => { clearFx(); const e = E.inExpo(t); fctx.fillStyle = '#fff'; union(x0, y0, .6 + e * 6, t * .5); fctx.beginPath(); fctx.arc(x0, y0, e * RMAX(), 0, TAU); fctx.fill(); a.el.style.transform = `translate(${(Math.random() - .5) * 16 * t}px,${(Math.random() - .5) * 16 * t}px)`; });
      prime(b); hide(a); show(b); reveal(b);
      await tween(780, t => { clearFx(); const e = E.outExpo(t); fctx.fillStyle = '#fff'; fctx.fillRect(0, 0, fx.width, fx.height); fctx.globalCompositeOperation = 'destination-out'; union(x1, y1, .05 + e * 5, -.4 + t * .4); fctx.beginPath(); fctx.arc(x1, y1, E.inCubic(t) * RMAX(), 0, TAU); fctx.fill(); });
      clearFx(); },
    birth: async (a, b) => { const [x0, y0] = focal(a), [x1, y1] = focal(b); const r = mulberry(3), C = [...Array(14)].map(() => ({ a: r() * TAU, d: 700 + r() * 700, s: 6 + r() * 40 }));
      a.el.style.transformOrigin = `${x0}px ${y0}px`;
      await tween(620, t => { const e = E.inCubic(t); a.el.style.transform = `scale(${1 - e * .18}) rotate(${-8 * e}deg)`; a.el.style.opacity = 1 - e; clearFx(); fctx.fillStyle = '#fff';
        C.forEach(c => { const ang = c.a + e * 4, dd = c.d * (1 - e); fctx.beginPath(); fctx.arc(lerp(x0, x1, e) + Math.cos(ang) * dd, lerp(y0, y1, e) + Math.sin(ang) * dd, c.s * (1 - e * .5), 0, TAU); fctx.fill(); }); });
      prime(b); hide(a); show(b); reveal(b); b.el.style.transformOrigin = `${x1}px ${y1}px`;
      await tween(760, t => { b.el.style.transform = `scale(${1.25 - .25 * E.outBack(t)})`; b.el.style.opacity = clamp(t * 3); clearFx();
        if (t < .35) { fctx.strokeStyle = '#fff'; fctx.lineWidth = 40 * (1 - t / .35); fctx.beginPath(); fctx.arc(x1, y1, E.outExpo(t / .35) * 900, 0, TAU); fctx.stroke(); } });
      b.el.style.cssText = ''; clearFx(); },
    shock: async (a, b) => { const [x0, y0] = focal(a); prime(b); show(b); reveal(b); b.el.style.zIndex = 2; const r = mulberry(9), N = 96, noise = [...Array(N)].map(() => 1 + (r() - .5) * .12), segs = [...Array(26)].map(() => ({ a: r() * TAU, l: .05 + r() * .35, th: 10 + r() * 50, o: (r() - .5) * 40 }));
      a.el.style.transformOrigin = `${x0}px ${y0}px`;
      b.unw = 3.2; const xr0 = a.xr || 0; pmReset();
      await tween(1100, t => { const e = E.inOut(t), R = e * RMAX() * 1.1; if (a.bst) a.xr = xr0 + 900 * t * t;
        b.el.style.clipPath = `polygon(${noise.map((n, i) => { const ang = i / N * TAU; return `${x0 + Math.cos(ang) * R * n}px ${y0 + Math.sin(ang) * R * n}px`; }).join(',')})`;
        a.el.style.transform = `scale(${1 - .06 * e})`;
        clearFx(); fctx.fillStyle = '#fff'; fctx.beginPath(); segs.forEach(s => { const rr = R + s.o + 20, a0 = s.a + t * .8, a1 = a0 + s.l; fctx.moveTo(x0 + Math.cos(a0) * rr, y0 + Math.sin(a0) * rr); fctx.arc(x0, y0, rr, a0, a1); fctx.arc(x0, y0, Math.max(0, rr - s.th), a1, a0, true); fctx.closePath(); }); fctx.fill(); });
      hide(a); a.xr = 0; b.el.style.cssText = ''; clearFx(); },
    sweep: async (a, b) => { const wedge = (cx, cy, w, rot) => { fctx.fillStyle = '#fff'; fctx.beginPath(); for (let i = 0; i < 18; i++) { const a0 = i / 18 * TAU + rot; fctx.moveTo(cx, cy); fctx.arc(cx, cy, RMAX() * 1.4, a0, a0 + w); fctx.closePath(); } fctx.fill(); };
      const [x0, y0] = focal(a), [x1, y1] = focal(b);
      await tween(560, t => { clearFx(); wedge(x0, y0, E.inCubic(t) * (TAU / 18 + .01), t * .7); });
      prime(b); hide(a); show(b); reveal(b);
      await tween(640, t => { clearFx(); const w = (1 - E.outCubic(t)) * (TAU / 18 + .01); if (w > .001) wedge(x1, y1, w, .7 + t * .9); });
      clearFx(); },
    shatter: async (a, b) => { const [x0, y0] = focal(a); prime(b); show(b); reveal(b); b.el.style.transformOrigin = `${x0}px ${y0}px`; const r = mulberry(4), N = 12, angs = [...Array(N)].map((_, i) => (i + r() * .6) / N * TAU), R = RMAX() * 1.3;
      const sh = angs.map((a0, i) => { const a1 = angs[(i + 1) % N] + (i === N - 1 ? TAU : 0), mid = (a0 + a1) / 2, c = cloneScr(a); c.style.zIndex = 3;
        c.style.clipPath = `polygon(${x0}px ${y0}px, ${x0 + Math.cos(a0) * R}px ${y0 + Math.sin(a0) * R}px, ${x0 + Math.cos(mid) * R}px ${y0 + Math.sin(mid) * R}px, ${x0 + Math.cos(a1) * R}px ${y0 + Math.sin(a1) * R}px)`;
        c.style.transformOrigin = `${x0}px ${y0}px`; return { c, mid, rot: (r() - .5) * 50, d: 500 + r() * 700, del: r() * .15 }; });
      a.el.style.visibility = 'hidden';
      await tween(1150, t => { b.el.style.transform = `scale(${1.08 - .08 * E.outCubic(t)})`; sh.forEach(s => { const q = clamp((t - s.del) / (1 - s.del)), e = E.inCubic(q); s.c.style.transform = `translate(${Math.cos(s.mid) * s.d * e}px,${Math.sin(s.mid) * s.d * e}px) rotate(${s.rot * e}deg)`; s.c.style.opacity = 1 - clamp((q - .6) / .4); });
        clearFx(); if (t < .2) { fctx.fillStyle = '#fff'; fctx.globalAlpha = 1 - t / .2; fctx.beginPath(); fctx.arc(x0, y0, 30 + t * 400, 0, TAU); fctx.fill(); fctx.globalAlpha = 1; } });
      sh.forEach(s => s.c.remove()); hide(a); b.el.style.cssText = ''; clearFx(); },
    slice: async (a, b) => { prime(b); show(b); reveal(b); b.el.style.zIndex = 1; b.el.style.visibility = 'hidden';
      await new Promise(r => setTimeout(r, 60)); const N = 9, h = H / N;
      const cl = [...Array(N)].map((_, i) => { const c = cloneScr(b); c.style.zIndex = 3; c.style.clipPath = `inset(${i * h}px 0 ${H - (i + 1) * h}px 0)`; return { c, dir: i % 2 ? 1 : -1, del: i * .045 }; });
      await tween(900, t => { cl.forEach(s => { const q = clamp((t - s.del) / .6), e = E.outExpo(q); s.c.style.transform = `translateX(${s.dir * W * (1 - e)}px)`; });
        fctx.clearRect(0, 0, fx.width, fx.height); fx.style.mixBlendMode = 'difference'; fctx.fillStyle = '#fff'; const y = E.inOut(t) * (H + 300) - 260; fctx.fillRect(0, y, fx.width, 140 * (1 - t) + 20); if (t < .12) fctx.fillRect(0, 0, fx.width, fx.height); });
      b.el.style.cssText = ''; hide(a); cl.forEach(s => s.c.remove()); clearFx(); },
    fade: async (a, b) => { prime(b); show(b); reveal(b); b.el.style.zIndex = 2; await tween(300, t => { b.el.style.opacity = t; }); hide(a); b.el.style.cssText = ''; }
  };
  const CHOREO = { 'about>plan': 'morph', 'plan>artists': 'shock', 'artists>artist': 'birth', 'artist>venue': 'shatter', 'artists>venue': 'sweep',
    'about>tickets': 'spin', 'plan>tickets': 'spin', 'artists>tickets': 'spin', 'artist>tickets': 'spin', 'venue>tickets': 'spin' };

  let busy = false, lockUntil = 0;
  async function go(id) {
    const to = ORDER.indexOf(id); if (busy || to < 0 || to === cur) return; busy = true;
    const a = SCREENS[cur], b = SCREENS[to];
    let key = reduce ? 'fade' : CHOREO[ORDER.indexOf(a.id) < to ? `${a.id}>${b.id}` : `${b.id}>${a.id}`] || 'sweep';
    if (key !== 'spin' && key !== 'shock' && key !== 'morph') { pmReset(); if (a.hero) bwrap.style.transform = ''; }
    try { await V[key](a, b); } catch (e) { console.error(e); hide(a); resetOut(a); show(b); reveal(b); clearFx(); }
    SCREENS.forEach((s, i) => { if (i !== to) hide(s); }); show(b);
    resetOut(a); cur = to; busy = false; lockUntil = performance.now() + 500; pmReset();
    if (b.id !== 'artist' && playing) setPlay(false);
    document.getElementById('hint').hidden = !b.hero;
    if (location.hash !== '#' + id) history.replaceState(null, '', '#' + id);
  }

  // links: hero nav (About/Plan/Artists/Venue), hero TICKETS, and everything marked data-go
  document.querySelectorAll('#heroScr .nav a.btn').forEach(a => a.addEventListener('click', () => go(a.getAttribute('href').slice(1))));
  document.getElementById('tickets').addEventListener('click', () => setTimeout(() => go('tickets'), 260));
  stage.addEventListener('click', e => { const g = e.target.closest('[data-go]'); if (g && !g.closest('#heroScr')) { e.preventDefault(); go(g.dataset.go); } });

  /* ---------- scroll / swipe between screens ---------- */
  const SEQ = ['about', 'plan', 'artists', 'venue', 'tickets'];
  const step = dir => { const id = SCREENS[cur].id === 'artist' ? 'artists' : SCREENS[cur].id; const i = SEQ.indexOf(id) + dir; if (i >= 0 && i < SEQ.length) go(SEQ[i]); };
  const ready = () => !busy && performance.now() > lockUntil && document.body.classList.contains('in') || (!busy && performance.now() > lockUntil && !SCREENS[cur].hero);
  const nextOf = dir => { const id = SCREENS[cur].id === 'artist' ? 'artists' : SCREENS[cur].id; const i = SEQ.indexOf(id) + dir; return i >= 0 && i < SEQ.length ? byId(SEQ[i]) : null; };
  // one "scroll" = one wheel gesture (a mouse notch or a trackpad flick incl. its inertia)
  function scrollStep(dir) {
    const nx = nextOf(dir); if (!nx) return;
    if (pm.target && pm.dir === dir) { step(dir); return; }                    // 2nd scroll → go
    if (pm.target && pm.dir !== dir) { pm.target = 0; return; }               // changed mind → settle back
    pm.dir = dir; pm.to = nx; pm.target = 1; pm.t0 = clock;                    // 1st scroll → charge
  }
  let gAcc = 0, gLock = false, gLast = 0;
  addEventListener('wheel', e => {
    e.preventDefault(); const now = performance.now();
    if (!ready()) { gLast = now; gLock = true; return; }
    if (gLock && now - gLast < 200) { gLast = now; return; }
    gLock = false; gLast = now;
    const dy = e.deltaMode === 1 ? e.deltaY * 40 : e.deltaMode === 2 ? e.deltaY * 800 : e.deltaY;
    gAcc += dy; if (Math.abs(gAcc) >= 40) { const dir = Math.sign(gAcc); gAcc = 0; gLock = true; scrollStep(dir); }
  }, { passive: false });
  let ty0 = null;
  addEventListener('touchstart', e => { ty0 = e.touches[0].clientY; }, { passive: true });
  addEventListener('touchend', e => { if (ty0 == null || !ready()) return; const d = ty0 - e.changedTouches[0].clientY; if (Math.abs(d) > 70) scrollStep(d > 0 ? 1 : -1); ty0 = null; }, { passive: true });
  addEventListener('keydown', e => { if (e.target.closest && e.target.closest('input')) return; if (e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === 'ArrowRight') step(1); if (e.key === 'ArrowUp' || e.key === 'PageUp' || e.key === 'ArrowLeft') step(-1); });

  /* ---------- venue: small photo pops up next to the cursor over each perk ---------- */
  const VS = byId('venue'), phEl = VS.el.querySelector('.ph'), phImg = VS.el.querySelector('.ph-i'); let phX = 0, phY = 0, phTX = 0, phTY = 0, phOn = false;
  const toBox = e => [e.clientX / S - DX / 2, e.clientY / S - DY];
  VS.el.querySelectorAll('[data-ph]').forEach(row => {
    row.addEventListener('pointerenter', e => { phImg.style.backgroundImage = `url(${PHOTOS[row.dataset.ph]})`; [phTX, phTY] = toBox(e); if (!phOn) { phX = phTX; phY = phTY; phOX = phTX < 1560 ? 40 : -360; phOY = phTX < 1560 ? -120 : -250; } phOn = true; phEl.classList.add('on'); document.body.classList.add('hot'); });
    row.addEventListener('pointermove', e => { [phTX, phTY] = toBox(e); });
    row.addEventListener('pointerleave', () => { phOn = false; phEl.classList.remove('on'); document.body.classList.remove('hot'); });
  });
  // over the big names the photo sits to the right of the cursor, over the descriptions column (x ≥ 1560) to the left
  let phOX = 40, phOY = -120;
  (function phLoop() { const vx = phTX - phX; phX += vx * .16; phY += (phTY - phY) * .16;
    const right = phTX < 1560, tox = right ? 40 : -360, toy = right ? -120 : -250; phOX += (tox - phOX) * .14; phOY += (toy - phOY) * .14;
    phEl.style.transform = `translate(${phX + phOX}px,${phY + phOY}px) rotate(${clamp(vx * .08, -8, 8)}deg)`; requestAnimationFrame(phLoop); })();

  // custom cursor grows over everything clickable on the new screens
  const cursor = document.getElementById('cursor');
  document.querySelectorAll('.scr:not(#heroScr) .go, .scr:not(#heroScr) a, .scr:not(#heroScr) button, .scr:not(#heroScr) input, .scr:not(#heroScr) label, .roll').forEach(el => {
    el.addEventListener('pointerenter', () => cursor.classList.add('big')); el.addEventListener('pointerleave', () => cursor.classList.remove('big')); });

  // deep link: #plan, #artists … opens that screen directly
  const start = location.hash.slice(1);
  if (start && start !== 'about' && ORDER.includes(start)) { const s = byId(start); hide(SCREENS[0]); prime(s); show(s); reveal(s); cur = ORDER.indexOf(start); document.getElementById('hint').hidden = true; }
})();
</script>
